<!DOCTYPE html>
<html lang="ru" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Личный кабинет — Журнал 24ДММ-2</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0C11">
  <link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Кабинет переехал в index.html и стал разделом «Профиль».
       Страница осталась перенаправлением, потому что у студентов она
       в закладках, на домашнем экране и в ссылках из бота. -->
  <link rel="canonical" href="index.html">
  <script>
    (function () {
      'use strict';
      // Прежние адреса кабинета ведут на свои новые разделы
      var MAP = { '': 'profile', '#home': 'profile', '#grades': 'zachetka', '#deadlines': 'deadlines' };
      var target = MAP[location.hash] || 'profile';
      location.replace('index.html#' + target);
    })();
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    a, button { touch-action: manipulation; }
    body { margin: 0; display: grid; place-items: center; min-height: 100vh;
           background: #060606; color: #e5e5ea;
           font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    a { color: #0a84ff; }
  </style>
</head>
<body>
  <p>Кабинет переехал в журнал. <a href="index.html#profile">Открыть «Профиль»</a></p>
</body>
</html>
